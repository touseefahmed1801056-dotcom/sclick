    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #0b0f1c; /* fallback deep navy */
      padding: 1.5rem;
      position: relative;
      /* Animated background layers */
      background: radial-gradient(circle at 20% 30%, rgba(0, 230, 255, 0.15), transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(170, 0, 255, 0.18), transparent 45%),
                  radial-gradient(circle at 40% 80%, rgba(0, 255, 170, 0.1), transparent 50%),
                  #0b0f1c;
      background-size: 200% 200%;
      animation: aurora 18s ease-in-out infinite alternate;
    }

    /* Smooth, slow-moving background effect */
    @keyframes aurora {
      0% {
        background-position: 0% 0%, 100% 100%, 20% 80%, 0% 0%;
      }
      50% {
        background-position: 30% 20%, 70% 60%, 40% 30%, 0% 0%;
      }
      100% {
        background-position: 80% 50%, 20% 30%, 70% 70%, 0% 0%;
      }
    }

    /* subtle floating particles overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48Y2lyY2xlIGN4PSI0IiBjeT0iNCIgcj0iMSIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjA0KSIvPjxjaXJjbGUgY3g9IjQwIiBjeT0iMjAiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNCkiLz48Y2lyY2xlIGN4PSI3MCIgY3k9IjUwIiByPSIxIiBmaWxsPSJyZ2JhKDI1NSwyNTUsMjU1LDAuMDQpIi8+PGNpcmNsZSBjeD0iMjAiIGN5PSI2MCIgcj0iMSIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjA0KSIvPjxjaXJjbGUgY3g9IjYwIiBjeT0iNzAiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNCkiLz48L3N2Zz4=');

    .link-card {

      transition: 0.05s;

    /* small arrow hint */

      opacity: 0.7;
      transition: transform 0.2s ease, opacity 0.2s;
      position: relative;
      z-index: 2;
      flex-shrink: 0;

    /* ----- WATER RIPPLE EFFECT (JS generated) ----- */

      pointer-events: none;
      z-index: 1;

    @keyframes ripple-animation {

      }

      }
      .btn-arrow {

      }
    }
  </style>

  <!-- JavaScript for ripple effect on buttons -->
  <script>
    (function() {
      const buttons = document.querySelectorAll('.smart-btn');
      
      buttons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          // Create ripple element
          const ripple = document.createElement('span');
          ripple.classList.add('ripple');
          
          // Get click coordinates relative to the button
          const rect = this.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          // Set ripple position and size
          const size = Math.max(rect.width, rect.height) * 1.6;
          ripple.style.width = ripple.style.height = `${size}px`;
          ripple.style.left = `${x - size / 2}px`;
          ripple.style.top = `${y - size / 2}px`;
          
          // Append ripple to button and remove after animation
          this.appendChild(ripple);
          
          // Remove the ripple after animation finishes
          setTimeout(() => {
            ripple.remove();
          }, 800);
        });
      });
    })();
  </script>
